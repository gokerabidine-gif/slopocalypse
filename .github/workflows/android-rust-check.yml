name: Android Rust libraries

on:
  push:
    branches: [android-apk-experiment]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "modules/**/rust/**"
      - "modules/**/*.gdextension"
      - ".github/workflows/android-rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Android target
        shell: bash
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not configured" >&2
            exit 1
          fi
          if [ -d "$SDK_ROOT/ndk/28.1.13356709" ]; then
            NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
          else
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found under $SDK_ROOT" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
            "$SDKMANAGER" --verbose --sdk_root="$SDK_ROOT" --install "ndk;28.1.13356709"
            NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/llvm-ar"
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
          echo "Android NDK and C/C++ cross-compilers configured"

      - name: Compile debug and release Rust extensions for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --target aarch64-linux-android
          cargo build --workspace --release --target aarch64-linux-android
          for manifest in modules/*/rust/gd/Cargo.toml; do
            module="$(dirname "$(dirname "$(dirname "$manifest")")")"
            crate="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            test -n "$crate"
            mkdir -p "$module/bin/android/debug" "$module/bin/android/release"
            cp "target/aarch64-linux-android/debug/lib$crate.so" "$module/bin/android/debug/lib$crate.so"
            cp "target/aarch64-linux-android/release/lib$crate.so" "$module/bin/android/release/lib$crate.so"
            echo "Prepared Android ARM64 libraries for $crate"
          done

      - name: Upload Android ARM64 GDExtension libraries
        uses: actions/upload-artifact@v4
        with:
          name: slopocalypse-android-arm64-libraries
          path: modules/*/bin/android/
          if-no-files-found: error
          retention-days: 7
