name: Android Rust libraries

on:
  push:
    branches: [android-apk-experiment]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "modules/**/rust/**"
      - ".github/workflows/android-rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Android target
        shell: bash
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not configured" >&2
            exit 1
          fi
          if [ -d "$SDK_ROOT/ndk/28.1.13356709" ]; then
            NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
          else
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found under $SDK_ROOT" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
            "$SDKMANAGER" --verbose --sdk_root="$SDK_ROOT" --install "ndk;28.1.13356709"
            NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
          fi
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Installed NDK at $NDK_DIR"

      - name: Configure Android linker
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Compile all Rust workspace crates for Android arm64
        run: cargo build --workspace --release --target aarch64-linux-android
