name: Android Rust libraries

on:
  push:
    branches: [android-apk-experiment]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "modules/**/rust/**"
      - "modules/**/*.gdextension"
      - "core/net.gd"
      - ".github/workflows/android-rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slopocalypse-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Android target
        shell: bash
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not configured" >&2
            exit 1
          fi
          if [ -d "$SDK_ROOT/ndk/28.1.13356709" ]; then
            NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
          else
            # GitHub-hosted Android images may already contain a usable NDK.
            # Prefer an installed version to avoid a large, unnecessary SDK download.
            NDK_DIR="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$NDK_DIR" ]; then
              SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
              if [ -z "$SDKMANAGER" ]; then
                echo "sdkmanager was not found under $SDK_ROOT" >&2
                exit 1
              fi
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
              timeout 20m "$SDKMANAGER" --verbose --sdk_root="$SDK_ROOT" --install "ndk;28.1.13356709"
              NDK_DIR="$SDK_ROOT/ndk/28.1.13356709"
            fi
          fi
          echo "Using Android NDK: $NDK_DIR"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/llvm-ar"
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
          echo "Android NDK and C/C++ cross-compilers configured"

      - name: Cache Cargo build outputs
        uses: actions/cache@v6
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-android-arm64-cargo-${{ hashFiles('Cargo.lock', 'modules/**/rust/**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-arm64-cargo-

      - name: Compile Android release Rust workspace for arm64
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          # Compile the workspace in one Cargo invocation so shared dependencies
          # are resolved and scheduled together, rather than rebuilding module-by-module.
          timeout 45m cargo build --workspace --release --target aarch64-linux-android
          for manifest in modules/*/rust/gd/Cargo.toml; do
            module="$(dirname "$(dirname "$(dirname "$manifest")")")"
            crate="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            test -n "$crate"
            mkdir -p "$module/bin/android/release"
            test -s "target/aarch64-linux-android/release/lib$crate.so"
            cp "target/aarch64-linux-android/release/lib$crate.so" "$module/bin/android/release/lib$crate.so"
            echo "Prepared Android ARM64 release library for $crate"
          done

      - name: Stage Android ARM64 GDExtension libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android-libraries
          for module in example inventory missions persistence voxkit weapons; do
            mkdir -p "build/android-libraries/modules/$module/bin/android"
            cp -a "modules/$module/bin/android/." "build/android-libraries/modules/$module/bin/android/"
          done

      - name: Upload Android ARM64 GDExtension libraries
        uses: actions/upload-artifact@v4
        with:
          name: slopocalypse-android-arm64-libraries
          path: build/android-libraries/
          if-no-files-found: error
          retention-days: 7


  android-apk:
    needs: android-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Installs the pinned Godot editor, third-party voxel extension, LFS assets,
      # Rust toolchain and project dependencies used by the existing desktop pipeline.
      - uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: tools/godot/editor_data/export_templates
          key: godot-4.7.2-export-templates-android-v1

      - name: Download Android ARM64 Rust extensions
        uses: actions/download-artifact@v4
        with:
          name: slopocalypse-android-arm64-libraries
          path: .
      
      - name: Copy release Rust libraries into Android debug paths
        shell: bash
        run: |
          set -euo pipefail
          for module in example inventory missions persistence voxkit weapons; do
            src="modules/$module/bin/android/release/lib${module}_gd.so"
            dst="modules/$module/bin/android/debug/lib${module}_gd.so"
            test -s "$src"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
            test -s "$dst"
            echo "Prepared non-empty Android debug library: $dst"
          done

      - name: Install Java and Android SDK components
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Godot 4.7.2 Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2.stable"
          TEMPLATE_DIR="$PWD/tools/godot/editor_data/export_templates/$GODOT_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ] || [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            curl -fL --retry 3 --retry-delay 2 \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
              -o "$TMP/templates.tpz"
            unzip -q "$TMP/templates.tpz" -d "$TMP/unpacked"
            if [ -d "$TMP/unpacked/templates" ]; then
              cp -a "$TMP/unpacked/templates/." "$TEMPLATE_DIR/"
            else
              cp -a "$TMP/unpacked/." "$TEMPLATE_DIR/"
            fi
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          echo "Installed Godot Android export templates"

      - name: Build native Linux GDExtensions for the editor
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          # Compile Linux release binaries once, then reuse them for editor debug mapping.
          timeout 45m cargo build --workspace --release
          for module in example inventory missions persistence voxkit weapons; do
            manifest="modules/$module/rust/gd/Cargo.toml"
            test -s "$manifest"
            crate="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            test -n "$crate"
            mkdir -p "modules/$module/bin/linux/debug" "modules/$module/bin/linux/release"
            test -s "target/release/lib$crate.so"
            cp "target/release/lib$crate.so" "modules/$module/bin/linux/debug/lib$crate.so"
            cp "target/release/lib$crate.so" "modules/$module/bin/linux/release/lib$crate.so"
            test -s "modules/$module/bin/android/release/lib${module}_gd.so"
            echo "Validated Android and Linux extensions for $module"
          done
      - name: Configure Android export preset and editor SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build/android
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p tools/godot/editor_data
          cat > tools/godot/editor_data/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/adb = "$ANDROID_SDK_ROOT/platform-tools/adb"
          EOF
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$DEBUG_KEYSTORE"
          keytool -list -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
          cat > export_presets.cfg <<EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/Slopocalypse.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          version/code=11
          version/name="0.11.0"
          package/unique_name="org.slopocalypse.game"
          package/name="Slopocalypse"
          package/signed=true
          keystore/debug="$DEBUG_KEYSTORE"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          screen/immersive_mode=true
          screen/orientation=0
          permissions/internet=true
          EOF

      - name: Import project for Android export
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/tools/godot/Godot_v4.7.2-stable_linux.x86_64"
          test -x "$GODOT"
          "$GODOT" --headless --editor --path . --quit

      # Export is isolated so validation runs even if Godot aborts during shutdown.
      - name: Export Android APK
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          GODOT="$PWD/tools/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --export-debug Android build/android/Slopocalypse.apk

      - name: Validate Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/Slopocalypse.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK archive verified"
          TMP_LIB="$(mktemp)"
          trap 'rm -f "$TMP_LIB"' EXIT
          for lib in example inventory missions persistence voxkit weapons; do
            entry="lib/arm64-v8a/lib${lib}_gd.so"
            unzip -p "$APK" "$entry" > "$TMP_LIB"
            size="$(stat -c%s "$TMP_LIB")"
            if [ "$size" -lt 1000000 ]; then
              echo "ERROR: ${entry} is missing or too small in APK (${size} bytes)" >&2
              exit 1
            fi
            readelf -h "$TMP_LIB" | grep -E "Class:.*ELF64|Machine:.*AArch64" >/dev/null
            echo "Validated ${entry}: ${size} bytes, ARM64 ELF"
          done
      - name: Upload Slopocalypse Android APK
        uses: actions/upload-artifact@v4
        with:
          name: slopocalypse-android-arm64-apk
          path: build/android/Slopocalypse.apk
          if-no-files-found: error
          retention-days: 14
